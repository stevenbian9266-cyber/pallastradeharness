name: Publish to npm (trusted publishing / OIDC)

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify tag matches package version
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Verify package contents
        run: npm pack --dry-run
      - name: Publish
        run: npm publish --access public --provenance
      - name: Sync README version info
        run: node bin/readme-sync.mjs --write
      - name: Open sync PR if README drifted
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- README.md README.en.md; then
            echo "✅ README in sync with $GITHUB_REF_NAME — no PR needed"
          else
            BRANCH="docs/readme-sync-${GITHUB_REF_NAME}"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -b "$BRANCH"
            git add README.md README.en.md
            git commit -m "docs: sync README version info for ${GITHUB_REF_NAME}"
            git push origin "$BRANCH"
            gh pr create --base main --head "$BRANCH" \
              --title "docs: sync README version info for ${GITHUB_REF_NAME}" \
              --body "Automated by the publish workflow: README version info drifted from package.json/CHANGELOG for ${GITHUB_REF_NAME}. Review and merge to keep docs in sync." \
              || echo "⚠️ PR creation failed (may already exist) — manual sync: npx harness readme:sync --write"
          fi

name: Publish to npm — RETIRED（已停用）

# 为何保留此文件而不是删除：
#   历史上本仓通过 tag 触发的 OIDC 受信发布把 pallastrade-harness 发到公共 npm。
#   2026-09 决策：**不再开源发布**，交付改为「本地构建 → 离线产物 → 部署到服务器」
#   （`deploy/README.md`：docker save → scp → docker load）。
#   保留文件是为了让来访者在 Actions 页面直接看到"发布链路已停用"及其替代方式，
#   而不是看到一个消失的工作流去猜。
#
# 现在如何发布：
#   powershell -File deploy/build-local.ps1        # 本机构建 + 离线产物 + manifest
#   powershell -File deploy/publish-local.ps1 -Server <ECS_IP> [-PublicSmoke]
#
# 如需恢复 npm 发布（例如重新开源）：恢复 git 历史中的本文件并删除下面的 guard job。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Explain retirement (no publish happens)
        run: |
          echo "❌ npm 发布已停用（retired）：本仓不再向公共 npm 发布。"
          echo "   替代路径：本地构建 → 离线产物 → 部署到服务器（见 deploy/README.md）。"
          echo "   Local build:  powershell -File deploy/build-local.ps1"
          echo "   Ship+deploy:  powershell -File deploy/publish-local.ps1 -Server <ECS_IP>"
          exit 1


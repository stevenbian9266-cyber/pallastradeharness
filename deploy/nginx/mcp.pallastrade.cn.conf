# /etc/nginx/sites-available/mcp.pallastrade.cn
# 版本化于仓库 deploy/nginx/；服务器端只做 cp + ln -s + nginx -t + reload（不现场手改）。
# 与 pallastrade 现有 vhost 完全独立：不同 server_name、不同证书、不同 upstream 端口。
# 前置：/etc/nginx/conf.d/mcp-ratelimit.conf 提供 zone mcp_rl。

server {
    listen 80;
    server_name mcp.pallastrade.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name mcp.pallastrade.cn;

    ssl_certificate     /etc/letsencrypt/live/mcp.pallastrade.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.pallastrade.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 1m;          # 应用层仍限 256KB（RFC-0005 §3.2）

    location = /healthz { proxy_pass http://127.0.0.1:3110; }
    location = /readyz  { proxy_pass http://127.0.0.1:3110; }

    location = /mcp {
        limit_req zone=mcp_rl burst=20 nodelay;
        proxy_pass http://127.0.0.1:3110;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    location / { return 404; }        # 站点静态页（M5）再挂，保持与其他项目隔离
}
